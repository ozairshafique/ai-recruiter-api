name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ai-recruiter-api

jobs:
  # ── Job 1: Tests ──────────────────────────────────────────
  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests with coverage
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          LANGCHAIN_TRACING_V2: "false"
          LANGCHAIN_PROJECT: "AI-Recruiter-API"
          LANGCHAIN_ENDPOINT: "https://api.smith.langchain.com"
          FAISS_INDEX_PATH: "./test_faiss_index"
          CHUNK_SIZE: "500"
          CHUNK_OVERLAP: "50"
          TOP_K: "5"
        run: |
          pytest tests/ -v \
            --ignore=tests/evaluation \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:coverage-html \
            --junitxml=test-results.xml \
            -p no:warnings

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml
            coverage-html/
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage-html/
          retention-days: 7

  # ── Job 2: Build & Validate Docker ───────────────────────
  docker:
    name: Build and Validate Docker Image
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_short }} \
            --label "build.date=${{ steps.meta.outputs.build_date }}" \
            --label "build.sha=${{ steps.meta.outputs.sha_short }}" \
            .

      - name: Validate Docker image
        run: |
          # Start container
          docker run -d \
            --name test-container \
            -p 8000:8000 \
            -e GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            -e LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }} \
            -e COHERE_API_KEY=${{ secrets.COHERE_API_KEY }} \
            -e LANGCHAIN_TRACING_V2="false" \
            -e LANGCHAIN_PROJECT="AI-Recruiter-API" \
            -e LANGCHAIN_ENDPOINT="https://api.smith.langchain.com" \
            -e FAISS_INDEX_PATH="./test_faiss_index" \
            -e CHUNK_SIZE="500" \
            -e CHUNK_OVERLAP="50" \
            -e TOP_K="5" \
            ${{ env.IMAGE_NAME }}:latest

          # Wait for container to be healthy
          echo "Waiting for container to start..."
          for i in {1..12}; do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "✅ Container is healthy"
              break
            fi
            if [ $i -eq 12 ]; then
              echo "❌ Container failed to start"
              docker logs test-container
              exit 1
            fi
            echo "Attempt $i/12 — waiting 5s..."
            sleep 5
          done

          # Print logs and stop
          docker logs test-container
          docker stop test-container
          docker rm test-container

      - name: Check Docker image size
        run: |
          SIZE=$(docker image inspect ${{ env.IMAGE_NAME }}:latest \
            --format='{{.Size}}' | awk '{printf "%.0f MB", $1/1024/1024}')
          echo "📦 Docker image size: $SIZE"

  # ── Job 3: Deploy to HuggingFace ─────────────────────────
  deploy:
    name: Deploy to HuggingFace Spaces
    needs: [tests, docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare deployment
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "ci@github.com"
          git config --global init.defaultBranch main

          # Copy only backend API files — exclude frontend and images
          mkdir -p /tmp/hf-deploy
          rsync -av \
            --exclude='.git/' \
            --exclude='images/' \
            --exclude='frontend/' \
            --exclude='coverage-html/' \
            --exclude='*.png' \
            --exclude='*.jpg' \
            --exclude='*.svg' \
            --exclude='*.gif' \
            --exclude='test-results.xml' \
            --exclude='coverage.xml' \
            . /tmp/hf-deploy/

      - name: Create HuggingFace README
        run: |
          cat > /tmp/hf-deploy/README.md << 'HFEOF'
          ---
          title: AI Recruiter API
          emoji: 🤖
          colorFrom: blue
          colorTo: indigo
          sdk: docker
          app_port: 7860
          pinned: true
          ---

          # 🤖 AI Recruiter API

          Production-grade RAG API for intelligent CV analysis and candidate querying.

          ### Links
          - 🎨 **Frontend:** [ai-recruiter-frontend-khaki.vercel.app](https://ai-recruiter-frontend-khaki.vercel.app)
          - 📖 **API Docs:** [/docs](https://ozair1112-ai-recruiter-api.hf.space/docs)
          - 💻 **GitHub:** [ozairshafique/ai-recruiter-api](https://github.com/ozairshafique/ai-recruiter-api)

          ### Stack
          FastAPI · LangChain · FAISS · Cohere · LLaMA 3.3 70B · Docker
          HFEOF

      - name: Deploy to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd /tmp/hf-deploy
          git init
          git checkout -b main
          git add .
          git commit -m "deploy: $(date +'%Y-%m-%d %H:%M:%S') — sha ${{ github.sha }}"
          git remote add hf https://ozair1112:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/ozair1112/ai-recruiter-api
          git push hf main --force
