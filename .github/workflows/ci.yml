name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          LANGCHAIN_TRACING_V2: "false"
          LANGCHAIN_PROJECT: "AI-Recruiter-API"
          LANGCHAIN_ENDPOINT: "https://api.smith.langchain.com"
          FAISS_INDEX_PATH: "./test_faiss_index"
          CHUNK_SIZE: "500"
          CHUNK_OVERLAP: "50"
          TOP_K: "5"
        run: |
          pytest tests/ -v \
            --ignore=tests/evaluation \
            -p no:warnings

  docker:
    name: Build and Push Docker Image
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-recruiter-api .

      - name: Test Docker image
        run: |
          docker run -d \
            --name test-container \
            -p 7860:7860 \
            -e PORT=7860 \
            -e GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            -e LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }} \
            -e COHERE_API_KEY=${{ secrets.COHERE_API_KEY }} \
            -e LANGCHAIN_TRACING_V2="false" \
            -e LANGCHAIN_PROJECT="AI-Recruiter-API" \
            -e LANGCHAIN_ENDPOINT="https://api.smith.langchain.com" \
            -e FAISS_INDEX_PATH="./test_faiss_index" \
            -e CHUNK_SIZE="500" \
            -e CHUNK_OVERLAP="50" \
            -e TOP_K="5" \
           ai-recruiter-api
           sleep 10
           curl -f http://localhost:7860/api/v1/health
           docker stop test-container
  deploy:
    name: Deploy to Hugging Face Spaces
    needs: [docker, tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "ci@github.com"
          git remote add hf https://ozair1112:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/ozair1112/ai-recruiter-api
          git push hf main --force
