services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-recruiter-application
    ports:
      - "8000:7860"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./faiss_index:/app/faiss_index
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - ai-recruiter-network

networks:
  ai-recruiter-network:
    driver: bridge

volumes:
  faiss_data:
